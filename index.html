<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuaca · Open-Meteo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
<meta name="description" content="Prakiraan cuaca per jam dari Open-Meteo">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuaca">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="reveal" style="--d:0s">
    <h1>Prakiraan Cuaca<small id="loc"></small></h1>
    <div class="acts"><button id="install" hidden>Pasang aplikasi</button><button id="theme" aria-label="Ganti tema">Mode gelap</button></div>
  </header>

  <section class="hero reveal" style="--d:.1s" id="hero" aria-label="Cuaca saat ini">
    <svg class="sky" viewBox="0 0 800 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g class="sun"><g class="rays">
        <line x1="400" y1="40" x2="400" y2="62"/><line x1="400" y1="178" x2="400" y2="200"/>
        <line x1="280" y1="120" x2="302" y2="120"/><line x1="498" y1="120" x2="520" y2="120"/>
        <line x1="315" y1="35" x2="330" y2="52"/><line x1="485" y1="35" x2="470" y2="52"/>
        <line x1="315" y1="205" x2="330" y2="188"/><line x1="485" y1="205" x2="470" y2="188"/>
      </g><circle class="halo" cx="400" cy="120" r="70"/><circle cx="400" cy="120" r="34" fill="#fff" opacity=".92"/></g>
      <g class="cloud c1"><ellipse cx="120" cy="60" rx="50" ry="16"/><ellipse cx="150" cy="48" rx="34" ry="16"/><ellipse cx="95" cy="52" rx="28" ry="12"/></g>
      <g class="cloud c2"><ellipse cx="620" cy="90" rx="60" ry="18"/><ellipse cx="650" cy="76" rx="38" ry="17"/><ellipse cx="590" cy="80" rx="30" ry="13"/></g>
      <path class="m m1" d="M-40 160 L120 100 L210 150 L330 90 L440 150 L560 95 L680 145 L840 105 V250 H-40Z"/>
      <path class="m m2" d="M-40 190 L90 150 L200 190 L320 140 L460 195 L600 145 L720 190 L840 160 V250 H-40Z"/>
      <path class="m m3" d="M-40 225 Q200 195 400 220 T840 205 V250 H-40Z"/>
    </svg>
    <div class="rain" id="rain" aria-hidden="true"></div>
    <div class="t"><b id="temp">0°</b><span id="cond"></span></div>
    <div class="r"><b id="clock"></b><span id="dateTxt"></span></div>
  </section>

  <section class="stats" id="stats"></section>

  <section class="chartbox reveal" style="--d:.5s">
    <div class="ch-h"><h2>Suhu dan peluang hujan per jam</h2>
      <div class="leg"><span><i></i>Suhu (°C)</span><span><i class="bar"></i>Peluang hujan (%)</span></div></div>
    <div class="tip" id="tip"></div>
    <svg id="chart" viewBox="0 0 800 260" role="img" aria-label="Grafik suhu dan peluang hujan"></svg>
    <div class="days" id="days"></div>
    <div class="sum" id="sum"></div>
    <div class="hrs" id="hrs"></div>
  </section>
  <footer class="reveal" style="--d:.7s">Data: Open-Meteo · diperbarui <span id="upd"></span> · zona waktu Asia/Jakarta</footer>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
